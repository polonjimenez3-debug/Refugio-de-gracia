<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iglesia Refugio de Gracia</title>
  <meta name="description" content="Iglesia Refugio de Gracia: un lugar donde la gracia de Dios transforma vidas.">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#nosotros">Saltar al contenido</a>

  <!-- ENCABEZADO -->
  <header class="header" id="header">
    <a href="#inicio" class="brand" aria-label="Ir al inicio"><img data-src="logo" alt="Logo Iglesia Refugio de Gracia"></a>
    <button class="burger" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
    <nav class="nav" id="nav" aria-label="Principal">
      <a href="#inicio">Inicio</a><a href="#nosotros">Nosotros</a><a href="#servicios">Servicios</a><a href="#ubicacion">Ubicación</a><a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <!-- PORTADA -->
    <section class="hero" id="inicio">
      <div class="hero-bg" id="heroBg"></div>
      <div class="ring ring-a"></div><div class="ring ring-b"></div>
      <div class="hero-inner">
        <h1 id="heroTitulo"></h1>
        <p id="heroTexto"></p>
        <div class="btns">
          <a class="btn btn-gold" href="#nosotros">Conócenos</a>
          <a class="btn btn-line" id="heroComo" target="_blank" rel="noopener">Cómo llegar</a>
        </div>
      </div>
    </section>

    <!-- SOBRE NOSOTROS -->
    <section class="section about" id="nosotros">
      <div class="wrap grid2">
        <div>
          <h2 id="nosTitulo"></h2>
          <div id="nosTextos" class="prose"></div>
        </div>
        <ul class="pillars" id="nosPilares"></ul>
      </div>
    </section>

    <!-- PASTOR -->
    <section class="section pastor" id="pastor">
      <div class="wrap grid2 rev">
        <figure class="photo" id="pastorFoto"></figure>
        <div>
          <h2 id="pastorNombre"></h2>
          <p class="role" id="pastorCargo"></p>
          <div class="prose" id="pastorTexto"></div>
        </div>
      </div>
    </section>

    <!-- SERVICIOS -->
    <section class="section services" id="servicios">
      <div class="wrap">
        <h2>Nos reunimos cada semana</h2>
        <div class="cards" id="servCards"></div>
      </div>
    </section>

    <!-- UBICACIÓN -->
    <section class="section loc" id="ubicacion">
      <div class="wrap grid2">
        <div>
          <h2>Ven a visitarnos</h2>
          <address id="locDir"></address>
          <p class="prose" id="locRef"></p>
          <a class="btn btn-navy" id="locBtn" target="_blank" rel="noopener">Obtener indicaciones</a>
        </div>
        <div class="map"><iframe id="mapa" title="Mapa de ubicación de la iglesia" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      </div>
    </section>

    <!-- CONTACTO -->
    <section class="section contact" id="contacto">
      <div class="wrap">
        <h2>Escríbenos</h2>
        <div class="contact-grid" id="contactGrid"></div>
      </div>
    </section>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="footer">
    <div class="wrap foot-grid">
      <div><img data-src="logo" alt="" class="foot-logo"><p class="foot-name" id="fNombre"></p></div>
      <div><h3>Dirección</h3><p id="fDir"></p></div>
      <div><h3>Horarios</h3><p id="fHor"></p></div>
      <div><h3>Redes</h3><p id="fRedes"></p></div>
    </div>
    <p class="copy" id="copy"></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
